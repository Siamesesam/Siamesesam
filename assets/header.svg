<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="SIAMESESAM // NETRUNNER">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00F0FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity="0.35"/>
    </pattern>
    <pattern id="hazard" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="11" height="22" fill="#FCEE0A"/>
    </pattern>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0.18"/>
    </linearGradient>
    <clipPath id="sliceA"><rect x="0" y="112" width="1200" height="30"/></clipPath>
    <clipPath id="sliceB"><rect x="0" y="152" width="1200" height="34"/></clipPath>
    <style>
      .mono { font-family: 'Consolas', 'JetBrains Mono', 'DejaVu Sans Mono', 'Menlo', monospace; }
      .title { font-size: 112px; font-weight: 800; letter-spacing: 6px; }
      .jitter { animation: jitter 5s steps(1) infinite; }
      .gc { opacity: 0; animation: gc 3.4s steps(1) infinite; }
      .gr { opacity: 0; animation: gr 3.4s steps(1) infinite; }
      .ghost { opacity: 0; fill: none; stroke-width: 1.5px; }
      .g1 { stroke: #00F0FF; animation: sv1 7s ease-out infinite; }
      .g2 { stroke: #FF003C; animation: sv2 7s ease-out infinite; }
      .g3 { stroke: #7CFF6B; animation: sv3 7s ease-out infinite; }
      .sweep { animation: sweep 4.5s linear infinite; }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes jitter {
        0%, 100% { transform: translate(0, 0); }
        41% { transform: translate(3px, 0) skewX(-4deg); }
        42% { transform: translate(-2px, 0); }
        43% { transform: translate(0, 0); }
      }
      @keyframes gc {
        0%, 100% { opacity: 0; transform: translate(0, 0); }
        8% { opacity: 0.9; transform: translate(-9px, 0); }
        10% { transform: translate(6px, 0); }
        12% { opacity: 0; }
        62% { opacity: 0.85; transform: translate(11px, 0); }
        64% { transform: translate(-4px, 0); }
        66% { opacity: 0; }
      }
      @keyframes gr {
        0%, 100% { opacity: 0; transform: translate(0, 0); }
        9% { opacity: 0.9; transform: translate(8px, 0); }
        11% { transform: translate(-5px, 0); }
        13% { opacity: 0; }
        63% { opacity: 0.85; transform: translate(-12px, 0); }
        65% { opacity: 0; }
      }
      @keyframes sv1 {
        0%, 72% { opacity: 0; transform: translateX(0); }
        75% { opacity: 0.7; transform: translateX(-12px); }
        90%, 100% { opacity: 0; transform: translateX(-34px); }
      }
      @keyframes sv2 {
        0%, 73% { opacity: 0; transform: translateX(0); }
        76% { opacity: 0.55; transform: translateX(-26px); }
        92%, 100% { opacity: 0; transform: translateX(-62px); }
      }
      @keyframes sv3 {
        0%, 74% { opacity: 0; transform: translateX(0); }
        77% { opacity: 0.4; transform: translateX(-40px); }
        94%, 100% { opacity: 0; transform: translateX(-90px); }
      }
      @keyframes sweep {
        from { transform: translateY(-120px); }
        to { transform: translateY(320px); }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="320" fill="#0A0A0F"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect class="sweep" x="0" y="0" width="1200" height="120" fill="url(#sweep)"/>

  <!-- 상단 경고 띠 -->
  <polygon points="0,0 440,0 414,24 0,24" fill="url(#hazard)"/>
  <polygon points="452,0 520,0 494,24 426,24" fill="#FCEE0A"/>
  <rect x="1060" y="0" width="140" height="8" fill="#FF003C"/>
  <text class="mono" x="1194" y="26" font-size="12" fill="#FF003C" text-anchor="end" letter-spacing="2">RESTRICTED // NC-2077</text>

  <!-- 모서리 브래킷 -->
  <g fill="none" stroke="#FCEE0A" stroke-width="3">
    <path d="M40 60V40H70"/>
    <path d="M1160 60V40H1130" transform="translate(0 0)"/>
    <path d="M40 260V280H70"/>
    <path d="M1160 260V280H1130"/>
  </g>

  <!-- 산데비스탄 잔상 -->
  <g class="mono title">
    <text class="ghost g3" x="70" y="182">SIAMESESAM</text>
    <text class="ghost g2" x="70" y="182">SIAMESESAM</text>
    <text class="ghost g1" x="70" y="182">SIAMESESAM</text>
  </g>

  <!-- 메인 타이틀 + 글리치 조각 -->
  <g class="mono title">
    <text class="jitter" x="70" y="182" fill="#FCEE0A">SIAMESESAM</text>
    <g clip-path="url(#sliceA)"><text class="gc" x="70" y="182" fill="#00F0FF">SIAMESESAM</text></g>
    <g clip-path="url(#sliceB)"><text class="gr" x="70" y="182" fill="#FF003C">SIAMESESAM</text></g>
  </g>

  <!-- 부제 -->
  <text class="mono" x="74" y="228" font-size="24" fill="#00F0FF" letter-spacing="3">// NETRUNNER · GHOST · AI-AUGMENTED<tspan class="blink" fill="#FCEE0A">_</tspan></text>

  <!-- 오른쪽 HUD -->
  <g class="mono" font-size="14" letter-spacing="1.5">
    <line x1="850" y1="76" x2="1150" y2="76" stroke="#00F0FF" stroke-opacity="0.5"/>
    <text x="850" y="68" fill="#00F0FF" fill-opacity="0.8">SUBJECT FILE</text>
    <text x="850" y="102" fill="#8A8F98">SYS.ID</text><text x="960" y="102" fill="#E6E6E6">0x05BFF3C4</text>
    <text x="850" y="126" fill="#8A8F98">CLASS</text><text x="960" y="126" fill="#E6E6E6">NETRUNNER</text>
    <text x="850" y="150" fill="#8A8F98">ORIGIN</text><text x="960" y="150" fill="#E6E6E6">CODER</text>
    <text x="850" y="174" fill="#8A8F98">CHROME</text><text x="960" y="174" fill="#FF003C">[CLASSIFIED]</text>
    <text x="850" y="198" fill="#8A8F98">SANDEVISTAN</text><text class="blink" x="960" y="198" fill="#7CFF6B">[ ONLINE ]</text>
  </g>

  <!-- 하단 바코드 + 상태 -->
  <g fill="#FCEE0A" fill-opacity="0.85">
    <rect x="74" y="250" width="3" height="22"/><rect x="80" y="250" width="1" height="22"/>
    <rect x="84" y="250" width="5" height="22"/><rect x="92" y="250" width="2" height="22"/>
    <rect x="97" y="250" width="1" height="22"/><rect x="101" y="250" width="4" height="22"/>
    <rect x="108" y="250" width="2" height="22"/><rect x="113" y="250" width="1" height="22"/>
    <rect x="117" y="250" width="6" height="22"/><rect x="126" y="250" width="1" height="22"/>
    <rect x="130" y="250" width="3" height="22"/><rect x="136" y="250" width="2" height="22"/>
  </g>
  <text class="mono" x="152" y="267" font-size="13" fill="#FCEE0A" letter-spacing="2">ID SCAN COMPLETE // ACCESS GRANTED</text>
  <line x1="560" y1="262" x2="1150" y2="262" stroke="#00F0FF" stroke-opacity="0.35" stroke-dasharray="2 6"/>
  <rect x="1120" y="254" width="30" height="16" fill="#FF003C"/>

  <!-- 스캔라인 -->
  <rect width="1200" height="320" fill="url(#scan)" pointer-events="none"/>
</svg>
