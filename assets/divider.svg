<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24" role="img" aria-label="divider">
  <defs>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00F0FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>
    <style>
      .pulse { animation: run 3.5s linear infinite; }
      @keyframes run {
        from { transform: translateX(-160px); }
        to { transform: translateX(1000px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse { animation: none; opacity: 0; }
      }
    </style>
  </defs>
  <polygon points="0,9 180,9 188,15 0,15" fill="#FCEE0A"/>
  <line x1="196" y1="12" x2="900" y2="12" stroke="#00F0FF" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="14 6"/>
  <g fill="#00F0FF" fill-opacity="0.6">
    <rect x="360" y="5" width="2" height="14"/><rect x="540" y="5" width="2" height="14"/><rect x="720" y="5" width="2" height="14"/>
  </g>
  <rect class="pulse" x="0" y="10" width="160" height="4" fill="url(#pulse)"/>
  <rect x="912" y="7" width="48" height="10" fill="#FF003C"/>
  <rect x="968" y="7" width="10" height="10" fill="#FF003C"/>
  <rect x="986" y="7" width="14" height="10" fill="#FCEE0A"/>
</svg>
